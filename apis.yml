name: Kickstarter
description: >-
  Kickstarter is a public-benefit crowdfunding platform where creators launch
  funding campaigns for creative projects — film, music, art, design, games,
  technology, publishing, and more — and backers pledge money to help bring
  them to life on an all-or-nothing funding model. Founded in 2009 and
  headquartered in Brooklyn, New York, it has channeled billions of dollars in
  pledges to hundreds of thousands of successfully funded projects. Kickstarter
  does not currently operate a public developer API program or developer
  portal; its GraphQL and REST endpoints power its own web and mobile clients
  and are not documented for third-party integration. The company does maintain
  an active open-source GitHub organization (including its iOS and Android app
  source), a help center, and a company blog. This API Evangelist profile
  tracks Kickstarter's public developer, security, and platform surface for
  discovery and enrichment.
